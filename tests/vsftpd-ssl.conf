# Additional vsftpd configuration for the FTP over TLS tests, appended
# to vsftpd.conf to create vsftpd-ssl.conf.  TLS is required for
# logins and data connections, and each data connection must resume
# the TLS session of the control connection.
ssl_enable=YES
rsa_cert_file=/etc/vsftpd/cert.pem
rsa_private_key_file=/etc/vsftpd/key.pem
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=YES
ssl_ciphers=HIGH
