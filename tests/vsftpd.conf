# vsftpd configuration for the sitecopy FTP tests: run standalone in
# the foreground, allowing the "sitecopy" local user to log in and
# write to its home directory.
# Listen on both IPv6 and IPv4, since "localhost" may resolve to ::1.
listen=NO
listen_ipv6=YES
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Passive mode data connections use a fixed port range, which is
# published 1:1 by the container fixture.
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21109
pasv_address=127.0.0.1

xferlog_enable=YES
seccomp_sandbox=NO
pam_service_name=vsftpd
