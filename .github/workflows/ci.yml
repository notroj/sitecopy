name: Build and test

on: [pull_request]

# Cancel any run still in progress for the same pull request when a
# new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: >-
      ${{ matrix.os }},
      ${{ matrix.bundled && 'bundled' || 'system' }} neon${{
      matrix.warnings && ', -Werror' || '' }}${{
      matrix.install && ', install' || '' }}${{
      (matrix.bundled && matrix.warnings && !matrix.install)
      && ', full tests' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-24.04-arm]
        install: [true, false]
        bundled: [true, false]
        warnings: [true, false]
    env:
      # The full test matrix (check-full) runs in one cell per OS, since
      # the container runtimes differ; the other cells run the minimal
      # set of combinations of rcfile options (check).
      CHECK: ${{ (matrix.bundled && matrix.warnings && !matrix.install)
                 && 'check-full' || 'check' }}
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - run: sudo apt-get update
    - run: sudo apt-get -y install autopoint gettext python3-pytest ${{ !matrix.bundled && 'libneon27-dev' || '' }}
    - run: ./autogen.sh
    - run: ./configure --prefix=/tmp/rootdir 
                       ${{ matrix.bundled && '--with-included-neon --with-ssl=openssl' || '--with-neon=/usr' }} 
                       ${{ matrix.warnings && '--enable-warnings' || '' }}
    - run: make ${{ !matrix.bundled && '-j`nproc`' || '' }}
                ${{ matrix.warnings && 'EXTRA_CFLAGS=-Werror' || '' }}
    - run: make install
      if: ${{ matrix.install }}
    - run: make ${{ env.CHECK }}

  # One-off builds with GCC warnings beyond --enable-warnings, as
  # errors, using the most recent Ubuntu for a recent GCC, with the C17
  # (with GNU extensions) and C23 standards.  Uses the system neon, so
  # the flags apply only to sitecopy's own code.  -Wunused-parameter is disabled, since
  # callbacks must take the parameters of their interfaces, and
  # -Wredundant-decls isn't used, since the bundled getopt.h repeats
  # the system's declarations.
  warnings:
    name: strict warnings (${{ matrix.std }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        std: [gnu17, c23]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - run: sudo apt-get update
    - run: sudo apt-get -y install autopoint gettext libneon27-dev
    - run: ./autogen.sh
    - run: ./configure --with-neon=/usr --enable-warnings
    - run: make EXTRA_CFLAGS="-Werror -Wextra -Wno-unused-parameter
                              -Wformat=2 -Wcast-align -Wwrite-strings
                              -Wmissing-prototypes -Wold-style-definition
                              -Wnull-dereference -Wduplicated-cond -Wlogical-op
                              -Wjump-misses-init -Wdouble-promotion
                              -Wnested-externs -Wunused-macros
                              -std=${{ matrix.std }}"

  # One-off builds with AddressSanitizer and UndefinedBehaviorSanitizer,
  # using the bundled neon so that it is instrumented too.  Errors
  # abort sitecopy, failing the tests.  Leak detection is disabled
  # until the remaining leaks (e.g. the FTP session is never freed)
  # are fixed.
  sanitize:
    name: >-
      ${{ matrix.sanitizer == 'address' && 'AddressSanitizer'
      || 'UndefinedBehaviorSanitizer' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - run: sudo apt-get update
    - run: sudo apt-get -y install autopoint gettext python3-pytest
    - run: ./autogen.sh
    - run: ./configure --with-included-neon --with-ssl=openssl
                       CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=${{ matrix.sanitizer }} -fno-sanitize-recover=all"
                       LDFLAGS="-fsanitize=${{ matrix.sanitizer }}"
    - run: make
    - run: make check
